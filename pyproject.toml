[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoidx-memory"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
memoidx = "memoidx.cli:main"
memoidx-init = "memoidx.bootstrap:main"

[tool.setuptools.packages.find]
include = ["memoidx*"]

[tool.setuptools.package-data]
memoidx = ["protocol.md", "memoidx-cli.md", "memoidx-scout.md"]
